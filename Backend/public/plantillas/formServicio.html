<form class="reg-form" name="formServicio" novalidate>
    <p class="reg-error" id="servicioError" role="alert" hidden></p>

    <div class="reg-campo">
        <label for="srvNombre">Nombre</label>
        <input id="srvNombre" name="nombre" type="text" maxlength="150" required>
    </div>

    <div class="reg-campo">
        <label for="srvCategoria">Categoría</label>
        <select id="srvCategoria" name="categoria" required></select>
    </div>

    <div class="reg-grid">
        <div class="reg-campo">
            <label for="srvPrecio">Precio de referencia (pts/h)</label>
            <input id="srvPrecio" name="precio" type="number" min="1" max="100" step="1" value="10" required>
        </div>
        <div class="reg-campo">
            <label for="srvTiempo">Tiempo estimado (h)</label>
            <input id="srvTiempo" name="tiempo" type="number" min="0.5" max="24" step="0.5" value="1" required>
        </div>
    </div>

    <div class="reg-campo">
        <label for="srvDescripcion">Descripción</label>
        <textarea id="srvDescripcion" name="descripcion" rows="3" maxlength="1000"></textarea>
    </div>

    <div class="reg-acciones">
        <button class="reg-boton reg-boton--contorno" type="button" onclick="document.body.modal.cerrarModal()">Cancelar</button>
        <button class="reg-boton reg-boton--primario" type="submit">Guardar</button>
    </div>
</form>
