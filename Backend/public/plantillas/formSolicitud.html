<form class="form" name="solicitarServicio" novalidate>
    <p>Vas a solicitar el servicio a <strong id="solicitudProfesional"></strong>.</p>

    <p class="aviso aviso-error" id="solicitudError" role="alert" hidden></p>

    <div class="fila">
        <div class="campo">
            <label for="fecha">Fecha y hora</label>
            <input id="fecha" name="fecha" type="datetime-local" required>
        </div>
        <div class="campo">
            <label for="horas">Horas estimadas</label>
            <input id="horas" name="horas" type="number" min="0.5" max="8" step="0.5" value="1" required>
        </div>
    </div>

    <p class="total" id="solicitudTotal"></p>
    <p class="ayuda">Los puntos se reservan de tu saldo al enviar la solicitud y pasan al profesional cuando los dos confirméis que el servicio está hecho. Si se rechaza o se cancela, se te devuelven.</p>

    <div class="botones">
        <button class="boton-borde" type="button" onclick="document.body.modal.cerrarModal()">Cancelar</button>
        <button class="boton" type="submit">Enviar solicitud</button>
    </div>
</form>
