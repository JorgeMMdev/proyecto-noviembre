<form class="reg-form" name="registrarUsuario" novalidate>
    <p class="reg-intro">Crea tu cuenta y empieza a ofrecer tus servicios.</p>

    <p class="reg-error" id="registroError" role="alert" hidden></p>

    <div class="reg-grid">
        <div class="reg-campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" required autocomplete="given-name">
        </div>
        <div class="reg-campo">
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" name="apellidos" type="text" required autocomplete="family-name">
        </div>
        <div class="reg-campo">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="reg-campo">
            <label for="nacimiento">Fecha de nacimiento</label>
            <input id="nacimiento" name="nacimiento" type="date" required>
        </div>
        <div class="reg-campo">
            <label for="contrasena">Contraseña</label>
            <input id="contrasena" name="contrasena" type="password" required autocomplete="new-password">
        </div>
        <div class="reg-campo">
            <label for="confirmar">Confirmar contraseña</label>
            <input id="confirmar" name="confirmar" type="password" required autocomplete="new-password">
            <small class="reg-aviso" id="avisoConfirmar" hidden></small>
        </div>
    </div>

    <fieldset class="reg-servicios">
        <legend>¿Qué servicios vas a ofrecer?</legend>
        <div class="reg-listas">
            <div class="reg-campo">
                <label for="categoria">Categorías</label>
                <select id="categoria" name="categoria" size="8"></select>
            </div>
            <div class="reg-campo">
                <label for="servicios">Servicios</label>
                <select id="servicios" name="servicios" size="8" multiple></select>
            </div>
            <div class="reg-campo reg-campo--seleccion">
                <label for="serviciosSelec">Seleccionados</label>
                <select id="serviciosSelec" name="serviciosSelec" size="8" multiple></select>
            </div>
        </div>
        <p class="reg-ayuda">Haz clic en un servicio para añadirlo, y otra vez para quitarlo.</p>
    </fieldset>

    <div class="reg-campo">
        <label for="cv">Currículum (opcional)</label>
        <input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx">
    </div>

    <div class="reg-acciones">
        <button class="reg-boton reg-boton--contorno" type="button" onclick="document.body.modal.cerrarModal()">Cancelar</button>
        <button class="reg-boton reg-boton--primario" type="submit" name="guardar">Crear cuenta</button>
    </div>
</form>
