<form class="reg-form" name="verificarCodigo" novalidate>
    <p class="reg-intro">Te hemos enviado un código de 6 cifras a tu correo. Escríbelo para terminar de iniciar sesión.</p>

    <p class="reg-error" id="codigoError" role="alert" hidden></p>

    <div class="reg-campo">
        <label for="codigo">Código de verificación</label>
        <input id="codigo" name="codigo" type="text" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" required>
    </div>

    <div class="reg-acciones">
        <button class="reg-boton reg-boton--contorno" type="button" onclick="document.body.modal.cerrarModal()">Cancelar</button>
        <button class="reg-boton reg-boton--primario" type="submit" name="verificar">Verificar</button>
    </div>
</form>
