services:
  web:
    build:
      context: ./Backend
      dockerfile: docker/Dockerfile
    container_name: bdh_web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./Backend:/var/www/html          # edición en caliente
      - vendor:/var/www/html/vendor      # evita que el volumen anterior tape vendor/
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}   # "debug" para depurar
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: bdh_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: bdh_pma
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  vendor:
  dbdata: